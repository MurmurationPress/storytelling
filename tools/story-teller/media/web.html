<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; media-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Story Teller</title><link rel="stylesheet" href="reader.css"><link rel="stylesheet" href="web.css"></head><body data-reader-instance="web"><header><div class="book-heading"><h1 id="book-title">Story Teller</h1><button id="contents-toggle" type="button" aria-controls="contents" aria-expanded="false">Contents</button></div><aside id="contents" aria-label="Part–Scene contents" hidden></aside><div class="scene-context" aria-label="Reading position"><h2 id="scene-title"></h2><span id="status" role="status"></span></div></header><nav aria-label="Story controls" class="compact-controls">
<button id="previous" type="button" class="icon-button" aria-label="Previous beat" title="Previous beat"></button>
<button id="playback-toggle" type="button" class="icon-button" aria-label="Play" title="Play" disabled></button>
<button id="next" type="button" class="icon-button" aria-label="Next beat" title="Next beat"></button>
<button id="sound-toggle" type="button" class="icon-button" aria-label="Mute sound" title="Mute sound" aria-pressed="false" disabled></button>
<button id="more-toggle" type="button" class="icon-button" aria-label="More options" title="More options" aria-expanded="false" aria-controls="more-options"></button>
<section id="more-options" role="group" aria-label="More playback options" data-story-aside hidden>
<button id="reveal" type="button">Reveal beat</button>
<button id="replay" type="button">Replay beat</button>
<button id="restart" type="button">Restart scene</button>
<label class="reader-preference" for="playback-speed">Playback speed <select id="playback-speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1× (default)</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label>
<label class="reader-preference"><input id="autoplay" type="checkbox" checked>Autoplay on beat turns</label>
<button id="enable-sound" type="button" hidden>Enable sound</button>
</section>
<div hidden><button id="play" type="button">Play</button><button id="pause" type="button">Pause</button><button id="mute" type="button" aria-pressed="false">Mute sound</button><button id="show-source" type="button">Show Beat in Source</button></div>
</nav><p id="warnings" role="status"></p><main id="beat" aria-label="Current story beat" tabindex="0"></main><button id="follow-story" type="button" hidden>Follow story ↓</button><script src="reader.js" defer></script></body></html>
